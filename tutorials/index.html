<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Complete ICT tutorials for O-Level and A-Level aligned with NCDC syllabus.">
  <title>ICT Tutorials | Yiga Gerald</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    /* Tutorial-specific styles - these won't conflict with your existing CSS */
    .tutorial-hero {
      text-align: center;
      padding: 3rem 1rem 2rem;
      background: var(--surface-soft, #f0f7ff);
      border-bottom: 1px solid var(--border, #e2e8f0);
    }
    .tutorial-hero h1 {
      font-size: 2.5rem;
      margin: 0.5rem 0;
      color: var(--text, #172033);
    }
    .tutorial-hero p {
      color: var(--muted, #64748b);
      max-width: 600px;
      margin: 0 auto;
    }
    .tutorial-card {
      display: flex;
      flex-direction: column;
      background: var(--surface, #ffffff);
      border-radius: var(--radius-md, 16px);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm, 0 4px 15px rgba(15,23,42,0.06));
      transition: transform 0.2s, box-shadow 0.2s;
      height: 100%;
      border-left: 4px solid var(--primary, #2563eb);
    }
    .tutorial-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md, 0 10px 30px rgba(15,23,42,0.08));
    }
    .tutorial-card .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.8rem;
    }
    .tutorial-card .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: var(--surface-soft, #f1f5f9);
      color: var(--muted, #64748b);
      border: 1px solid var(--border, #e2e8f0);
    }
    .tutorial-card .badge.level-s1 { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .tutorial-card .badge.level-s2 { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
    .tutorial-card .badge.level-s3 { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .tutorial-card .badge.level-s4 { background: #fce4ec; color: #b91c1c; border-color: #f9a8b4; }
    .tutorial-card .badge.level-s5 { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; }
    .tutorial-card .badge.level-s6 { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
    .tutorial-card .badge.difficulty-beginner { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .tutorial-card .badge.difficulty-intermediate { background: #fef9c3; color: #854d0e; border-color: #fde047; }
    .tutorial-card .badge.difficulty-advanced { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .tutorial-card .badge.practical { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .tutorial-card .badge.theory { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    .tutorial-card h3 {
      font-size: 1.1rem;
      margin: 0 0 0.4rem 0;
      color: var(--text, #172033);
    }
    .tutorial-card h3 a {
      text-decoration: none;
      color: inherit;
    }
    .tutorial-card h3 a:hover {
      color: var(--primary, #2563eb);
    }
    .tutorial-card .description {
      font-size: 0.9rem;
      color: var(--text-soft, #475569);
      flex-grow: 1;
      margin-bottom: 1rem;
    }
    .tutorial-card .meta-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted, #94a3b8);
      border-top: 1px solid var(--border, #e2e8f0);
      padding-top: 0.8rem;
      margin-top: auto;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1rem 1.5rem;
      background: var(--surface, #ffffff);
      border-radius: var(--radius-md, 16px);
      border: 1px solid var(--border, #e2e8f0);
    }
    .filter-bar input,
    .filter-bar select {
      padding: 0.6rem 1rem;
      border: 1px solid var(--border, #cbd5e1);
      border-radius: 6px;
      font-size: 0.95rem;
      background: var(--surface, #ffffff);
      flex: 1 1 200px;
      color: var(--text, #172033);
    }
    .filter-bar input:focus,
    .filter-bar select:focus {
      outline: 2px solid var(--primary, #2563eb);
      outline-offset: 1px;
      border-color: transparent;
    }
    .card-grid {
      display: grid;
      gap: 1.5rem;
    }
    .card-grid.three {
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    }
    .no-results {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted, #64748b);
      grid-column: 1 / -1;
    }
    .no-results h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: var(--text, #172033);
    }
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin: 1rem 0 2rem;
    }
    .stat-item {
      background: var(--surface, #ffffff);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--muted, #475569);
      border: 1px solid var(--border, #e2e8f0);
    }
    .stat-item strong {
      color: var(--text, #172033);
    }
    @media (max-width: 640px) {
      .filter-bar { flex-direction: column; }
      .filter-bar input,
      .filter-bar select { flex: 1 1 auto; width: 100%; }
      .tutorial-hero h1 { font-size: 1.8rem; }
      .card-grid.three { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="tutorials">

<div id="site-header"></div>

<main>
  <section class="tutorial-hero section">
    <div class="container">
      <p class="eyebrow">📚 Tutorials</p>
      <h1>ICT Tutorials</h1>
      <p>Aligned with the NCDC syllabus for O-Level and A-Level ICT</p>
      <div class="stats-bar" id="stats-bar">
        <span class="stat-item"><strong id="total-tutorials">0</strong> tutorials</span>
        <span class="stat-item">O-Level · <strong id="o-level-count">0</strong></span>
        <span class="stat-item">A-Level · <strong id="a-level-count">0</strong></span>
      </div>
      <div style="margin-top:0.5rem;display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;">
        <span class="badge level-s1">S.1</span>
        <span class="badge level-s2">S.2</span>
        <span class="badge level-s3">S.3</span>
        <span class="badge level-s4">S.4</span>
        <span class="badge level-s5">S.5</span>
        <span class="badge level-s6">S.6</span>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filter-bar">
        <input id="tutorial-search" type="search" placeholder="Search tutorials..." aria-label="Search tutorials">
        <select id="tutorial-level" aria-label="Filter by level">
          <option value="all">All levels</option>
          <option value="s1">S.1</option>
          <option value="s2">S.2</option>
          <option value="s3">S.3</option>
          <option value="s4">S.4</option>
          <option value="s5">S.5</option>
          <option value="s6">S.6</option>
        </select>
        <select id="tutorial-topic" aria-label="Filter by topic">
          <option value="all">All topics</option>
          <option value="computer-basics">Computer Basics</option>
          <option value="hardware">Hardware</option>
          <option value="word-processing">Word Processing</option>
          <option value="spreadsheets">Spreadsheets</option>
          <option value="databases">Databases</option>
          <option value="web-design">Web Design</option>
          <option value="presentations">Presentations</option>
          <option value="ai">AI & Emerging Tech</option>
          <option value="security">Security</option>
          <option value="file-management">File Management</option>
          <option value="electronic-publication">Electronic Publication</option>
        </select>
        <select id="tutorial-difficulty" aria-label="Filter by difficulty">
          <option value="all">All difficulties</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
      <div id="tutorial-grid" class="card-grid three">
        <div class="loading-message" style="text-align:center;grid-column:1/-1;padding:2rem;color:var(--muted, #94a3b8);">Loading tutorials...</div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<!-- Use your existing navigation.js to load header/footer -->
<script src="../data/tutorials-data.js"></script>
<script src="../js/navigation.js"></script>
<script>
  // This script renders the tutorials grid using your existing navigation.js
  document.addEventListener('DOMContentLoaded', function() {
    const grid = document.getElementById('tutorial-grid');
    const searchInput = document.getElementById('tutorial-search');
    const levelFilter = document.getElementById('tutorial-level');
    const topicFilter = document.getElementById('tutorial-topic');
    const difficultyFilter = document.getElementById('tutorial-difficulty');

    // Check if tutorial data is available
    if (typeof tutorials === 'undefined') {
      grid.innerHTML = '<div class="no-results"><h3>⚠️ Tutorial data not found</h3><p>Please make sure tutorials-data.js is loaded correctly.</p></div>';
      return;
    }

    function updateStats(filtered) {
      const total = document.getElementById('total-tutorials');
      const oLevel = document.getElementById('o-level-count');
      const aLevel = document.getElementById('a-level-count');
      if (total) total.textContent = tutorials.length;
      if (oLevel) oLevel.textContent = tutorials.filter(t => ['s1','s2','s3','s4'].includes(t.level)).length;
      if (aLevel) aLevel.textContent = tutorials.filter(t => ['s5','s6'].includes(t.level)).length;
    }

    function renderTutorials() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const levelValue = levelFilter.value;
      const topicValue = topicFilter.value;
      const difficultyValue = difficultyFilter.value;

      const filtered = tutorials.filter(t => {
        const searchMatch = !searchTerm ||
          t.title.toLowerCase().includes(searchTerm) ||
          (t.description && t.description.toLowerCase().includes(searchTerm)) ||
          (t.topic && t.topic.replace('-',' ').includes(searchTerm)) ||
          (t.tags && t.tags.some(tag => tag.toLowerCase().includes(searchTerm)));

        const levelMatch = levelValue === 'all' || t.level === levelValue;
        const topicMatch = topicValue === 'all' || (t.topic && t.topic === topicValue);
        const difficultyMatch = difficultyValue === 'all' || t.difficulty === difficultyValue;

        return searchMatch && levelMatch && topicMatch && difficultyMatch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results"><h3>🔍 No tutorials found</h3><p>Try adjusting your search or filters.</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(t => `
        <div class="tutorial-card">
          <div class="badge-group">
            <span class="badge level-${t.level}">${t.level.toUpperCase()}</span>
            <span class="badge difficulty-${t.difficulty || 'beginner'}">${t.difficulty || 'Beginner'}</span>
            ${t.practical ? '<span class="badge practical">💻 Practical</span>' : '<span class="badge theory">📖 Theory</span>'}
            ${t.topic ? `<span class="badge" style="background:var(--surface-soft, #f1f5f9);">${t.topic.replace('-',' ')}</span>` : ''}
          </div>
          <h3><a href="${t.url || '#'}">${t.title}</a></h3>
          ${t.description ? `<p class="description">${t.description}</p>` : ''}
          <div class="meta-footer">
            <span>⏱️ ${t.time || '5 min'}</span>
            ${t.prerequisites && t.prerequisites.length ? `<span>📌 ${t.prerequisites.join(', ')}</span>` : ''}
          </div>
        </div>
      `).join('');
    }

    searchInput.addEventListener('input', renderTutorials);
    levelFilter.addEventListener('change', renderTutorials);
    topicFilter.addEventListener('change', renderTutorials);
    difficultyFilter.addEventListener('change', renderTutorials);

    updateStats();
    renderTutorials();
  });
</script>

</body>
  </html>
