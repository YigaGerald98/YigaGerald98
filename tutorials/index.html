<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Practical ICT tutorials by Yiga Gerald aligned with NCDC syllabus.">
<title>Tutorials | Yiga Gerald</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<style>
  /* Additional styles for tutorial cards */
  .tutorial-card {
    display: flex;
    flex-direction: column;
    background: var(--card-bg, #fff);
    border-radius: 8px;
    padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
    height: 100%;
    border-left: 4px solid var(--primary-color, #2563eb);
  }
  .tutorial-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  .tutorial-card .badge-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 0.8rem;
  }
  .tutorial-card .badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    background: var(--badge-bg, #f1f5f9);
    color: var(--badge-text, #475569);
  }
  .tutorial-card .badge.level-s1 { background: #dbeafe; color: #1e40af; }
  .tutorial-card .badge.level-s2 { background: #d1fae5; color: #065f46; }
  .tutorial-card .badge.level-s3 { background: #fef3c7; color: #92400e; }
  .tutorial-card .badge.level-s4 { background: #fce4ec; color: #b91c1c; }
  .tutorial-card .badge.level-s5 { background: #e0e7ff; color: #3730a3; }
  .tutorial-card .badge.level-s6 { background: #f3e8ff; color: #6b21a8; }
  .tutorial-card .badge.difficulty-beginner { background: #dcfce7; color: #166534; }
  .tutorial-card .badge.difficulty-intermediate { background: #fef9c3; color: #854d0e; }
  .tutorial-card .badge.difficulty-advanced { background: #fee2e2; color: #991b1b; }
  .tutorial-card .badge.practical { background: #dbeafe; color: #1e40af; }
  .tutorial-card .badge.theory { background: #f1f5f9; color: #475569; }
  .tutorial-card h3 {
    font-size: 1.1rem;
    margin: 0 0 0.4rem 0;
    color: var(--heading-color, #0f172a);
  }
  .tutorial-card .description {
    font-size: 0.9rem;
    color: var(--text-muted, #64748b);
    flex-grow: 1;
    margin-bottom: 1rem;
  }
  .tutorial-card .meta-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-muted, #94a3b8);
    border-top: 1px solid var(--border-light, #e2e8f0);
    padding-top: 0.8rem;
    margin-top: auto;
  }
  .tutorial-card .meta-footer .time {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .tutorial-card .meta-footer .prereq {
    color: var(--primary-color, #2563eb);
    text-decoration: none;
    font-weight: 500;
  }
  .tutorial-card .meta-footer .prereq:hover {
    text-decoration: underline;
  }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 2rem;
    padding: 1rem;
    background: var(--filter-bg, #f8fafc);
    border-radius: 8px;
  }
  .filter-bar input,
  .filter-bar select {
    padding: 0.6rem 1rem;
    border: 1px solid var(--border-color, #cbd5e1);
    border-radius: 6px;
    font-size: 0.95rem;
    background: white;
    flex: 1 1 200px;
  }
  .filter-bar input:focus,
  .filter-bar select:focus {
    outline: 2px solid var(--primary-color, #2563eb);
    outline-offset: 1px;
  }
  .no-results {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted, #64748b);
  }
  .no-results h3 {
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
  }
  @media (max-width: 640px) {
    .filter-bar {
      flex-direction: column;
    }
    .filter-bar input,
    .filter-bar select {
      flex: 1 1 auto;
      width: 100%;
    }
  }
</style>
</head>
<body data-page="tutorials">

<div id="site-header"></div>

<main>
  <!-- Hero Section -->
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Tutorials</p>
      <h1>Short, practical ICT lessons.</h1>
      <p>Quick guides designed around skills learners can immediately practise, aligned with the NCDC syllabus.</p>
      <div style="margin-top:1rem; display:flex; flex-wrap:wrap; gap:0.8rem; justify-content:center;">
        <span class="badge level-s1">S.1</span>
        <span class="badge level-s2">S.2</span>
        <span class="badge level-s3">S.3</span>
        <span class="badge level-s4">S.4</span>
        <span class="badge level-s5">S.5</span>
        <span class="badge level-s6">S.6</span>
      </div>
    </div>
  </section>

  <!-- Tutorial Grid Section -->
  <section class="section">
    <div class="container">
      <div class="filter-bar">
        <input id="tutorial-search" type="search" placeholder="Search tutorials by title or topic..." aria-label="Search tutorials">
        <select id="tutorial-level" aria-label="Filter tutorials by level">
          <option value="all">All levels</option>
          <option value="s1">S.1</option>
          <option value="s2">S.2</option>
          <option value="s3">S.3</option>
          <option value="s4">S.4</option>
          <option value="s5">S.5</option>
          <option value="s6">S.6</option>
        </select>
        <select id="tutorial-topic" aria-label="Filter tutorials by topic">
          <option value="all">All topics</option>
          <option value="computer-basics">Computer Basics</option>
          <option value="hardware">Hardware</option>
          <option value="word-processing">Word Processing</option>
          <option value="spreadsheets">Spreadsheets</option>
          <option value="databases">Databases</option>
          <option value="web-design">Web Design</option>
          <option value="presentations">Presentations</option>
          <option value="ai">AI & Emerging Tech</option>
          <option value="security">Security</option>
        </select>
      </div>
      <div id="tutorial-grid" class="card-grid three">
        <!-- Tutorial cards will be rendered here by JavaScript -->
        <div class="loading-message" style="text-align:center; grid-column:1/-1; padding:2rem;">Loading tutorials...</div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<!-- Data file with tutorial list -->
<script src="../data/tutorials-data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/utilities.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const grid = document.getElementById('tutorial-grid');
    const searchInput = document.getElementById('tutorial-search');
    const levelFilter = document.getElementById('tutorial-level');
    const topicFilter = document.getElementById('tutorial-topic');

    // Check if tutorial data is available
    if (typeof tutorials === 'undefined') {
      grid.innerHTML = `<div class="no-results"><h3>⚠️ Tutorial data not found</h3><p>Please make sure tutorials-data.js is loaded correctly.</p></div>`;
      return;
    }

    function renderTutorials() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const levelValue = levelFilter.value;
      const topicValue = topicFilter.value;

      const filtered = tutorials.filter(t => {
        // Search filter (title, description, topic, tags)
        const searchMatch = !searchTerm || 
          t.title.toLowerCase().includes(searchTerm) ||
          (t.description && t.description.toLowerCase().includes(searchTerm)) ||
          (t.topic && t.topic.toLowerCase().includes(searchTerm)) ||
          (t.tags && t.tags.some(tag => tag.toLowerCase().includes(searchTerm)));

        // Level filter
        const levelMatch = levelValue === 'all' || t.level === levelValue;

        // Topic filter
        const topicMatch = topicValue === 'all' || 
          (t.topic && t.topic === topicValue) ||
          (t.tags && t.tags.includes(topicValue));

        return searchMatch && levelMatch && topicMatch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results" style="grid-column:1/-1;">
          <h3>🔍 No tutorials found</h3>
          <p>Try adjusting your search or filters.</p>
        </div>`;
        return;
      }

      grid.innerHTML = filtered.map(t => `
        <div class="tutorial-card">
          <div class="badge-group">
            <span class="badge level-${t.level}">${t.level.toUpperCase()}</span>
            <span class="badge difficulty-${t.difficulty || 'beginner'}">${t.difficulty || 'Beginner'}</span>
            ${t.practical ? '<span class="badge practical">Practical</span>' : '<span class="badge theory">Theory</span>'}
            ${t.topic ? `<span class="badge" style="background:#e2e8f0;">${t.topic.replace('-',' ')}</span>` : ''}
          </div>
          <h3><a href="${t.url || '#'}" style="text-decoration:none; color:inherit;">${t.title}</a></h3>
          ${t.description ? `<p class="description">${t.description}</p>` : ''}
          <div class="meta-footer">
            <span class="time">⏱️ ${t.time || '5 min'}</span>
            ${t.prerequisites && t.prerequisites.length ? 
              `<span>Prereq: ${t.prerequisites.map(p => `<a href="#" class="prereq">${p}</a>`).join(' ')}</span>` : 
              ''}
          </div>
        </div>
      `).join('');
    }

    // Event listeners for filtering
    searchInput.addEventListener('input', renderTutorials);
    levelFilter.addEventListener('change', renderTutorials);
    topicFilter.addEventListener('change', renderTutorials);

    // Initial render
    renderTutorials();
  });
</script>

</body>
  </html>
